name: Data Cron

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes for testing

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch wallet balances
        run: npm run fetch-balances

      - name: Fetch dashboard data
        run: npm run fetch-dashboard
        env:
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}

      - name: Fetch roadmap data
        run: npm run fetch-roadmap
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: data
          branch: gh-pages
