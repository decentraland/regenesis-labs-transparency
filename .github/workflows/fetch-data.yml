name: Fetch Data and Deploy

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 15 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch wallet balances
        run: npm run fetch-balances

      - name: Fetch dashboard data
        run: npm run fetch-dashboard
        env:
          SPREADSHEET_ID: ${{ vars.SPREADSHEET_ID }}
          SHEET_GID: ${{ vars.SHEET_GID }}

      - name: Fetch roadmap data
        run: npm run fetch-roadmap
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: data
          branch: gh-pages
